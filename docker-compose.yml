services:
  postgres:
    image: postgres:16-alpine
    container_name: clipcraft-postgres
    environment:
      POSTGRES_DB: clipcraft
      POSTGRES_USER: clipcraft
      POSTGRES_PASSWORD: clipcraft
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipcraft -d clipcraft"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql://clipcraft:clipcraft@postgres:5432/clipcraft
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
